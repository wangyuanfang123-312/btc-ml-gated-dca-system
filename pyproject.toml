[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-ml-gated-dca"
version = "0.1.0"
description = "Reproducible BTCUSDT 4H ML-gated DCA research backtest"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "scipy>=1.13",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
btc-dca = "btc_dca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

